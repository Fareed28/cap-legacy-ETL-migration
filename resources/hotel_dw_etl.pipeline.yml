resources:
  pipelines:
    hotel_dw_etl:
      # Unique per target so CI (production mode) does not collide with an existing pipeline name
      name: hotel_dw_etl_${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      photon: true
      channel: CURRENT
      root_path: ../src/hotel_dw_etl
      libraries:
        - glob:
            include: ../src/hotel_dw_etl/transformations/**
      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
      tags:
        project: hotel_dw_etl
        layer: curated
        rud_participant: "true"
        use_case: CAP-8
